syntax = "proto3";

package common;

// ==================== ERROR TYPES ====================

// Error codes (aligned with gRPC status codes)
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  OK = 1;
  CANCELLED = 2;
  UNKNOWN = 3;
  INVALID_ARGUMENT = 4;
  DEADLINE_EXCEEDED = 5;
  NOT_FOUND = 6;
  ALREADY_EXISTS = 7;
  PERMISSION_DENIED = 8;
  RESOURCE_EXHAUSTED = 9;
  FAILED_PRECONDITION = 10;
  ABORTED = 11;
  OUT_OF_RANGE = 12;
  UNIMPLEMENTED = 13;
  INTERNAL = 14;
  UNAVAILABLE = 15;
  DATA_LOSS = 16;
  UNAUTHENTICATED = 17;
}

// Error details
message ErrorDetail {
  string field = 1;
  string message = 2;
}

// Error response
message ErrorResponse {
  ErrorCode code = 1;
  string message = 2;
  repeated ErrorDetail details = 3;
  string request_id = 4;
}
