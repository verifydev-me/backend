# ============================================
# VerifyDev API Gateway - API Routes
# ============================================

server {
    listen 80;
    listen [::]:80;
    server_name api.verifydev.io localhost;

    # ==========================================
    # Health Check
    # ==========================================
    location /health {
        access_log off;
        return 200 '{"status":"healthy","service":"gateway","timestamp":"$time_iso8601"}';
        add_header Content-Type application/json;
    }

    # ==========================================
    # API Documentation (Future)
    # ==========================================
    location /docs {
        return 301 https://docs.verifydev.io;
    }

    # ==========================================
    # CORS Preflight Handler
    # ==========================================
    location @cors_preflight {
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With, Accept' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Max-Age' '86400' always;
        add_header 'Content-Length' '0';
        add_header 'Content-Type' 'text/plain charset=UTF-8';
        return 204;
    }

    # ==========================================
    # Auth Service Routes
    # ==========================================
    location /api/v1/auth {
        # CORS
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        # Proxy
        proxy_pass http://auth_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ==========================================
    # User Service Routes
    # ==========================================
    location /api/v1/users {
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        proxy_pass http://user_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Public Profiles
    location /api/v1/u {
        add_header 'Access-Control-Allow-Origin' '*' always;

        proxy_pass http://user_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # Cache public profiles for 5 minutes
        proxy_cache_valid 200 5m;
    }

    # ==========================================
    # Project Routes
    # ==========================================
    location /api/v1/projects {
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        proxy_pass http://user_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;  # Longer for batch uploads
        proxy_read_timeout 120s;
    }

    # ==========================================
    # Experience Routes (Education, Work, Certs)
    # ==========================================
    location /api/v1/experiences {
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        proxy_pass http://user_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ==========================================
    # Skill Routes
    # ==========================================
    location /api/v1/skills {
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        proxy_pass http://user_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ==========================================
    # Job Service Routes
    # ==========================================
    location /api/v1/jobs {
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        proxy_pass http://job_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Job Applications
    location /api/v1/applications {
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        proxy_pass http://job_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ==========================================
    # Recruiter Service Routes
    # ==========================================
    location /api/v1/recruiters {
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        proxy_pass http://recruiter_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Candidate Search (Recruiter)
    location /api/v1/candidates {
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        proxy_pass http://recruiter_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ==========================================
    # Resume Service Routes
    # ==========================================
    location /api/v1/resumes {
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        proxy_pass http://resume_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # Longer timeout for PDF generation
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        
        # Handle large PDF responses
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # ==========================================
    # Service Health Checks (Internal)
    # ==========================================
    location /internal/health/auth {
        internal;
        proxy_pass http://auth_service/health;
    }

    location /internal/health/user {
        internal;
        proxy_pass http://user_service/health;
    }

    location /internal/health/job {
        internal;
        proxy_pass http://job_service/health;
    }

    location /internal/health/recruiter {
        internal;
        proxy_pass http://recruiter_service/health;
    }

    location /internal/health/resume {
        internal;
        proxy_pass http://resume_service/health;
    }

    location /internal/health/analyzer {
        internal;
        proxy_pass http://analyzer_service/health;
    }

    # ==========================================
    # Aggregated Health Check
    # ==========================================
    location /api/health {
        access_log off;
        default_type application/json;
        return 200 '{"gateway":"healthy","status":"ok"}';
    }

    # ==========================================
    # Error Handling
    # ==========================================
    error_page 429 = @rate_limit_exceeded;
    location @rate_limit_exceeded {
        default_type application/json;
        return 429 '{"success":false,"message":"Rate limit exceeded. Please slow down.","error":{"code":"RATE_LIMIT_EXCEEDED"}}';
    }

    error_page 502 = @service_unavailable;
    location @service_unavailable {
        default_type application/json;
        return 502 '{"success":false,"message":"Service temporarily unavailable","error":{"code":"SERVICE_UNAVAILABLE"}}';
    }

    error_page 504 = @gateway_timeout;
    location @gateway_timeout {
        default_type application/json;
        return 504 '{"success":false,"message":"Request timeout","error":{"code":"GATEWAY_TIMEOUT"}}';
    }

    # Catch-all for undefined routes
    location / {
        default_type application/json;
        return 404 '{"success":false,"message":"Endpoint not found","error":{"code":"NOT_FOUND"}}';
    }
}
