# ============================================
# VerifyDev API Gateway - Main Configuration
# ============================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ==========================================
    # Logging Format
    # ==========================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log json;

    # ==========================================
    # Performance Settings
    # ==========================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # ==========================================
    # Compression
    # ==========================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript 
               application/rss+xml application/atom+xml image/svg+xml;

    # ==========================================
    # Security Headers
    # ==========================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ==========================================
    # Rate Limiting - DISABLED for development
    # ==========================================
    # Uncomment below for production
    # limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    # limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=20r/m;
    # limit_req_zone $binary_remote_addr zone=apply_limit:10m rate=10r/m;

    # ==========================================
    # Upstream Services (Load Balancing)
    # ==========================================
    
    # Auth Service
    upstream auth_service {
        least_conn;
        server auth-service:3001 weight=1 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # User Service
    upstream user_service {
        least_conn;
        server user-service:3002 weight=1 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Job Service
    upstream job_service {
        least_conn;
        server job-service:3004 weight=1 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Recruiter Service
    upstream recruiter_service {
        least_conn;
        server recruiter-service:3005 weight=1 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Resume Service (Go)
    upstream resume_service {
        least_conn;
        server resume-service:8003 weight=1 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Project Analyzer (Go) - Internal only, health check exposed
    upstream analyzer_service {
        server project-analyzer:8001 weight=1 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # Include service-specific configurations
    include /etc/nginx/conf.d/*.conf;
}
