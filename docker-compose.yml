  #     - ./ai-service:/app
  #     - /app/node_modules
  #   depends_on:
  #     - job-service
  #     - user-service
  #   restart: unless-stopped
  #   networks:
  #     - verifydev-network
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 512M
  #         cpus: '0.5'
  #   logging:
  #     driver: json-file
  #     options:
  #       max-size: "10m"
  #       max-file: "3"

  # ══════════════════════════════════════════════════════════════════════════════
  #                              💾 PERSISTENT VOLUMES
  # ══════════════════════════════════════════════════════════════════════════════
volumes:
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  analyzer_repos:
    driver: local

# ══════════════════════════════════════════════════════════════════════════════
#                              🔗 NETWORK CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════
networks:
  verifydev-network:
    driver: bridge
    name: verifydev-network
